<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Light Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-nMfaZkX7Ofd1qLtZ2o1E5Yb2KdhavvA6xEGV6XBrPl5pHCyZXwC6oUqK0r2rCgeIik9YmT4C9H0DqCl6YcI5xg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="dist/output.css">
</head>
<body class="h-screen">
    <main class="font-poppins text-white px-4 flex flex-col justify-between min-h-screen overflow-hidden bg-linear-to-t from-[#000000] to-[#994040] duration-300">

    <div class="now-playing flex-1 flex flex-col">
        
        <div class="music-source flex items-center justify-between py-2 mt-2">
            <i id="back-arrow" class="fa-solid fa-chevron-down cursor-pointer"></i>
            <h1 class="text-xl">Now Playing</h1>
            <i class="fa-solid fa-list-ul cursor-pointer"></i>
        </div>

        <div class="track-info flex flex-col items-center mt-2 flex-1">
            <img class="track-img mt-4 sm:mt-10 rounded-xl w-full max-w-[300px] aspect-square object-cover" src="" alt="track-img">

            <div class="track-details flex flex-col pt-4 overflow-hidden marquee-wrapper">
                <h2 class="track-title text-lg marquee"></h2>
                <h3 class="track-artist text-2xl font-bold whitespace-nowrap"></h3>
            </div>
        </div>

        <div class="reaction-tab flex flex-row gap-4 mt-4 overflow-x-auto snap-x snap-mandatory scroll-smooth cursor-pointer px-1">
            <button class="react-btn text-xl flex items-center" id="love-btn"><i class="fa-regular fa-heart pr-1"></i></button>
            <button class="react-btn text-xl flex items-center" id="message-btn"><i class="fa-regular fa-message pr-1"></i></button>
            <button class="react-btn text-xl flex items-center" id="save-btn"><i class="fa-regular fa-bookmark pr-1"></i><span>save</span></button>
            <button class="react-btn text-xl flex items-center" id="share-btn"><i class="fa-regular fa-share-from-square pr-1"></i><span>share</span></button>
            <button class="react-btn text-xl flex items-center" id="download-btn"><i class="fa-solid fa-arrow-down pr-1"></i><span>download</span></button>
            <button class="react-btn text-xl flex items-center" id="radio-btn"><i class="fa-regular fa-wifi pr-1"></i><span>radio</span></button>
        </div>

        <div class="timer-container flex flex-col mt-4">
            <input type="range" class="progress-bar w-full h-1 bg-green-500 border-0" value="0" min="0" max="100">
            <div class="flex flex-row justify-between mt-1 text-sm">
                <span class="current-time"></span>
                <span class="total-duration"></span>
            </div>
        </div>

        <div class="controls flex flex-row justify-between items-center mt-4">
            <span class="shuf-rep text-xl" id="shuffle"><i class="fa-solid fa-shuffle"></i></span>

            <div class="buttons flex flex-row items-center justify-center gap-4">
                <button class="control-btn text-2xl cursor-pointer" id="prev-btn"><i class="fa-solid fa-backward"></i></button>
                <button class="cursor-pointer control-btn big-btn border rounded-full text-3xl w-16 h-16 sm:w-20 sm:h-20 text-black bg-[#1DB954]" id="play-btn"><i class="fa-solid fa-play"></i></button>
                <button class="cursor-pointer control-btn big-btn border rounded-full text-3xl w-16 h-16 sm:w-20 sm:h-20 text-black bg-[#1DB954] hidden" id="pause-btn"><i class="fa-solid fa-pause"></i></button>
                <button class="cursor-pointer control-btn text-2xl" id="next-btn"><i class="fa-solid fa-forward"></i></button>
            </div>

            <span class="shuf-rep text-xl" id="repeat"><i class="fa-solid fa-repeat"></i></span>
        </div>

    </div>

    <footer class="p-2 text-center text-xs text-gray-500">
        Developed by <span class="text-purple-400">BuzzAlvin</span>
    </footer>

</main>
    <script src="js/home.js" defer></script>
    <script src="js/script.js" defer></script>
    <script src="js/nav.js" defer></script>

</body>
</html>
