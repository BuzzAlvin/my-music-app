<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Light Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-nMfaZkX7Ofd1qLtZ2o1E5Yb2KdhavvA6xEGV6XBrPl5pHCyZXwC6oUqK0r2rCgeIik9YmT4C9H0DqCl6YcI5xg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="dist/output.css">
</head>
<body class="h-screen">
    <main class="font-poppins text-white py-2 px-4 h-dvh flex flex-col justify-between min-h-screen max-h-screen overflow-hidden bg-linear-to-t from-[#000000] to-[#994040] duration-300">
        <div class="now-playing">
            <div class="music-source flex items-center justify-between py-3 mt-3">
                 <i id="back-arrow" class="fa-solid fa-chevron-down cursor-pointer"></i>
                 <h1 class="text-xl">Now Playing</h1>
                  <i class="fa-solid fa-list-ul cursor-pointer"></i>
            </div>
            <div class="track-info flex flex-col items-center mt-3">
                <img class="track-img mt-10 rounded-xl h-[300px]" src="" alt="track-img">
                <div class="track-details flex flex-col pt-6 overflow-hidden marquee-wrapper">
                    <h2 class="track-title text-lg marquee"></h2>
                    <h3 class="track-artist text-2xl font-bold whitespace-nowrap"></h3>
                </div>
            </div>

            <div class="reaction-tab flex flex-row gap-6  mt-5 overflow-x-auto snap-x snap-mandatory scroll-smooth cursor-pointer">
                <button class="react-btn text-2xl flex items-center text-center" id="love-btn"><i class="fa-regular fa-heart pr-1"></i><span></span></button>
                <button class="react-btn text-2xl flex items-center text-center" id="message-btn"><i class="pr-1 fa-regular fa-message"></i><span></span></button>
                <button class="react-btn text-2xl flex items-center text-center" id="save-btn"><i class="pr-1 fa-regular fa-bookmark"></i><span>save</span></button>
                <button class="react-btn text-2xl flex items-center text-center" id="share-btn"><i class="pr-1 fa-regular fa-share-from-square"></i><span>share</span></button>
                <button class="react-btn text-2xl flex items-center text-center" id="download-btn"><i class="pr-1 fa-solid fa-arrow-down"></i><span>download</span></button>
                <button class="react-btn text-2xl flex items-center text-center" id="radio-btn"><i class="pr-1 fa-regular fa-wifi"></i><span>radio</span></button>
            </div>

            <div class="timer-container flex flex-col py-2 mt-6">
                <input type="range" class="progress-bar w-full h-1 bg-green-500 border-0" value="0" min="0" max="100">
                <div class="flex flex-row justify-between">
                    <span class="current-time mt-2 text-sm"></span>
                    <span class="total-duration mt-1 text-sm"></span>
                </div>
            </div>

            <div class="controls flex flex-row justify-between items-center">
                <span class="shuf-rep text-xl" id="shuffle"><i class="fa-solid fa-shuffle"></i></span>
                <div class="buttons flex flex-row items-center justify-center gap-4">
                    <button class="control-btn text-2xl cursor-pointer" id="prev-btn"><i class="fa-solid fa-backward"></i></button>
                    <button class="cursor-pointer control-btn big-btn border rounded-full text-3xl w-20 h-20 text-black bg-[#1DB954]" id="play-btn"><i class="fa-solid fa-play"></i></button>
                    <button class="cursor-pointer control-btn big-btn border rounded-full text-3xl w-20 h-20 text-black bg-[#1DB954] hidden" id="pause-btn"><i class="fa-solid fa-pause"></i></button>
                    <button class="cursor-pointer control-btn text-2xl" id="next-btn"><i class="fa-solid fa-forward"></i></button>
                </div>
                <span class="shuf-rep text-xl" id="repeat"><i class="fa-solid fa-repeat"></i></span>
            </div>
        </div>

      <footer class="p-4 text-center text-xs text-gray-500 mt-6">
    Developed by <span class="text-purple-400">BuzzAlvin</span>
  </footer>
</main>
    <script src="js/home.js" defer></script>
    <script src="js/script.js" defer></script>
    <script src="js/nav.js" defer></script>

</body>
</html>
