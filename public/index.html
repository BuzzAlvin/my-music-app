<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Light Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-nMfaZkX7Ofd1qLtZ2o1E5Yb2KdhavvA6xEGV6XBrPl5pHCyZXwC6oUqK0r2rCgeIik9YmT4C9H0DqCl6YcI5xg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./style/main.css">
</head>
<body>
    <main class="music-body">
        <div class="now-playing">
            <div class="music-source">
                 <i class="fa-solid fa-chevron-down"></i>
                 <h1>Now Playing</h1>
                  <i class="fa-solid fa-list-ul"></i></i>
            </div>
            <div class="track-info">
                <img src="../assets/img/adult-3086302_1280.jpg" alt="track-img" class="track-img">
                <div class="track-details">
                    <h2 class="track-title"></h2>
                    <h3 class="track-artist"></h3>
                </div>
            </div>

            <div class="reaction-tab">
                <button class="react-btn" id="love-btn"><i class="fa-regular fa-heart "></i><span>20</span></button>
                <button class="react-btn" id="message-btn"><i class="fa-regular fa-message"></i><span>5</span></button>
                <button class="react-btn" id="save-btn"><i class="fa-regular fa-bookmark"></i><span>save</span></button>
                <button class="react-btn" id="share-btn"><i class="fa-regular fa-share-from-square"></i><span>share</span></button>
                <button class="react-btn" id="download-btn"><i class="fa-solid fa-arrow-down"></i><span>download</span></button>
                <button class="react-btn" id="radio-btn"><i class="fa-regular fa-wifi"></i><span>radio</span></button>
            </div>

            <div class="timer-container">
                <span class="current-time"></span>
                <input type="range" class="progress-bar" value="0" min="0" max="100">
                <span class="total-duration"></span>
            </div>

            <div class="controls">
                <span class="shuf-rep" id="shuffle"><i class="fa-solid fa-shuffle"></i></span>
                <div class="buttons">
                    <button class="control-btn" id="prev-btn"><i class="fa-solid fa-backward"></i></button>
                    <button class="control-btn big-btn" id="play-btn"><i class="fa-solid fa-play"></i></button>
                    <button class="control-btn big-btn" id="pause-btn"><i class="fa-solid fa-pause"></i></button>
                    <button class="control-btn" id="next-btn"><i class="fa-solid fa-forward"></i></button>
                </div>
                <span class="shuf-rep" id="repeat"><i class="fa-solid fa-repeat"></i></span>
            </div>
        </div>

        <P class="signature">
            made with &#10084; by BuzzAlvin
        </P>
    </main>
    <script src="./script.js"></script>
</body>
</html>
